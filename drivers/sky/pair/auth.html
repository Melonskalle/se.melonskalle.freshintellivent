<style>
  .fi-wrap { padding: 4px 0; }
  .fi-wrap p { margin: 0 0 12px; line-height: 1.4; }
  .fi-row { display: flex; gap: 8px; margin: 12px 0; }
  .fi-row input { flex: 1; font-family: monospace; font-size: 16px; }
  .fi-msg { min-height: 20px; margin: 8px 0; }
  .fi-err { color: #c0392b; }
  .fi-ok { color: #1e8449; }
  .fi-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
</style>

<div class="fi-wrap">
  <p data-i18n="pair.auth.intro"></p>
  <ol>
    <li data-i18n="pair.auth.step1"></li>
    <li data-i18n="pair.auth.step2"></li>
  </ol>

  <button class="homey-button-secondary-full" id="fetch" data-i18n="pair.auth.fetch"></button>

  <div class="fi-row">
    <input class="homey-form-input" id="code" maxlength="8" placeholder="a1b2c3d4" autocomplete="off" />
  </div>
  <div class="fi-msg" id="msg"></div>

  <div class="fi-buttons">
    <button class="homey-button-primary-full" id="add" data-i18n="pair.auth.add"></button>
    <button class="homey-button-transparent" id="skip" data-i18n="pair.auth.skip"></button>
  </div>
</div>

<script type="application/javascript">
  var device = null;
  var msg = document.getElementById('msg');
  var codeInput = document.getElementById('code');

  function show(text, ok) {
    msg.textContent = text || '';
    msg.className = 'fi-msg ' + (ok ? 'fi-ok' : 'fi-err');
  }

  Homey.setTitle(Homey.__('pair.auth.title'));

  Homey.emit('get_selected').then(function (d) {
    device = d;
    if (!device) show(Homey.__('pair.no_device'));
  });

  document.getElementById('fetch').addEventListener('click', function () {
    show(Homey.__('pair.auth.fetching'), true);
    Homey.showLoadingOverlay();
    var started = Date.now();
    function fail(err) {
      Homey.hideLoadingOverlay();
      show((err && err.message) || String(err));
    }
    function poll() {
      Homey.emit('fetch_code_status').then(function (s) {
        if (s.state === 'done') {
          Homey.hideLoadingOverlay();
          codeInput.value = s.code;
          show(Homey.__('pair.auth.fetched'), true);
        } else if (s.state === 'error') {
          fail(s.error);
        } else if (Date.now() - started > 120000) {
          fail(Homey.__('pair.auth.timeout'));
        } else {
          setTimeout(poll, 1500);
        }
      }).catch(fail);
    }
    Homey.emit('fetch_code_start').then(function () { setTimeout(poll, 1500); }).catch(fail);
  });

  function create(code) {
    if (!device) return show(Homey.__('pair.no_device'));
    var d = {
      name: device.name,
      data: device.data,
      store: device.store,
      settings: { auth_key: code || '' },
    };
    Homey.createDevice(d)
      .then(function () { Homey.done(); })
      .catch(function (err) { show(err.message || String(err)); });
  }

  document.getElementById('add').addEventListener('click', function () {
    var code = codeInput.value.trim();
    if (!code) return show(Homey.__('pair.auth.need_code'));
    Homey.emit('validate_code', code)
      .then(function (hex) { create(hex); })
      .catch(function (err) { show(err.message || String(err)); });
  });

  document.getElementById('skip').addEventListener('click', function () {
    create('');
  });
</script>
